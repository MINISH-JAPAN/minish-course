<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Minish Course – Session 8 顔貌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* Hide Netlify promotional badge */
  [data-netlify-badge], #netlify-badge, .netlify-badge,
  a[href*="netlify.com"][target="_blank"] { display: none !important; }
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2f7;--card:#fff;--frame:#0e1520;
  --primary:#1a3f6b;--accent:#2c7bd0;--success:#18945e;
  --danger:#c0392b;--muted:#5e7087;--sub:#4a6080;
  --border:#c8d8ea;--text:#1a2535;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Header */
.header{background:var(--frame);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);gap:8px}
.logo{font-size:13px;font-weight:700;letter-spacing:.5px;min-width:0;flex-shrink:1}
.logo .hl{color:var(--accent)}
.logo .ses{opacity:.6;font-size:11px;font-weight:400;margin-left:6px}
.nav-tabs{display:flex;gap:3px;flex-shrink:0}
.nav-tab{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif;transition:all .2s;white-space:nowrap}
.nav-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Main */
.main{max-width:860px;margin:0 auto;padding:14px}

/* Photo card */
.photo-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.photo-card-header{background:var(--primary);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:8px}
.cat-num{background:var(--accent);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.cat-name{font-size:13px;font-weight:500}
.cat-sub{font-size:10px;opacity:.65;margin-left:auto}
.photo-pair{display:grid;grid-template-columns:1fr 1fr}
.photo-slot{padding:4px 0 0}
.photo-slot+.photo-slot{border-left:none}
.slot-label{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;text-align:center}
.photo-frame{width:100%;aspect-ratio:4/3;background:var(--bg);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);position:relative}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.frame-ph{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;text-align:center;padding:6px}
.frame-ph .icon{font-size:22px}
.upload-btn{width:100%;margin-top:6px;padding:7px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:background .2s}
.upload-btn:hover{background:#1a6bbf}
.upload-btn.done{background:var(--success)}
.upload-btn input[type=file]{display:none}

/* Submit section */
.submit-sec{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:14px}
.field-label{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:8px}
.name-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Noto Sans JP',sans-serif;background:var(--bg)}
.name-input:focus{outline:none;border-color:var(--accent)}
.progress-bar{margin-top:10px;height:4px;background:var(--border);border-radius:2px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.progress-txt{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}
.submit-btn{width:100%;margin-top:10px;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:background .2s}
.submit-btn:not(:disabled):hover{background:var(--accent)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:10px;color:var(--muted);margin-top:5px;text-align:center}

/* Admin */
.admin-tabs{display:flex;gap:6px;margin-bottom:14px}
.admin-tab{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif;transition:all .2s}
.admin-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.section-box{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:14px}
.section-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px;border-bottom:2px solid var(--border);padding-bottom:7px}
.sample-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:540px){.sample-grid{grid-template-columns:repeat(3,1fr)}}
.sample-lbl{font-size:10px;font-weight:500;color:var(--sub);margin-bottom:4px}

/* Submissions */
.sub-item{display:flex;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:all .2s}
.sub-item:hover{border-color:var(--accent);background:#f0f7ff}
.sub-name{font-weight:500;font-size:14px;flex:1}
.sub-meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.4}

/* Review */
.review-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back-btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif;flex-shrink:0}
.review-title{flex:1;min-width:0}
.review-actions{display:flex;gap:6px;flex-shrink:0}
.action-btn{padding:7px 13px;border:none;border-radius:6px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;font-weight:500;transition:all .2s;white-space:nowrap}
.ss-btn{background:var(--primary);color:#fff}
.ss-btn:hover{background:var(--accent)}
.pdf-btn{background:var(--success);color:#fff}
.pdf-btn:hover{background:#15804f}
.pdf-btn:disabled{opacity:.6;cursor:not-allowed}

/* Password modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:300px;text-align:center}
.modal-title{font-size:16px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.modal-input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;text-align:center;letter-spacing:2px;margin-bottom:10px;font-family:'Noto Sans JP',sans-serif}
.modal-input:focus{outline:none;border-color:var(--accent)}
.modal-btn{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--frame);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:500;animation:fadeInOut 2.6s forwards;white-space:nowrap}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* Success */
.success-screen{text-align:center;padding:50px 20px}
.success-icon{font-size:64px;margin-bottom:16px}
.success-title{font-size:22px;font-weight:700;color:var(--success);margin-bottom:10px}
.success-sub{font-size:13px;color:var(--muted);line-height:1.8}
.reset-btn{margin-top:22px;padding:10px 28px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

/* Guide bar */
.guide-bar{font-size:11px;color:var(--muted);margin-bottom:10px;padding:0 2px}

/* ── Slideshow Overlay ───────────────────────────────────── */
.ss-overlay{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column}
.ss-header{background:rgba(14,21,32,.95);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
.ss-title-block{min-width:0}
.ss-name{color:#fff;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-cat{color:rgba(255,255,255,.65);font-size:12px;margin-top:2px}
.ss-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ss-counter{color:rgba(255,255,255,.55);font-size:13px}
.ss-close-btn{color:#fff;background:rgba(255,255,255,.15);border:none;border-radius:6px;padding:6px 13px;cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif;transition:background .2s}
.ss-close-btn:hover{background:rgba(255,255,255,.3)}
.ss-body{flex:1;display:flex;flex-direction:row;min-height:0}
.ss-panel{flex:1;display:flex;flex-direction:column;min-height:0}
.ss-panel+.ss-panel{border-left:2px solid rgba(255,255,255,.1)}
.ss-panel-label{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);font-size:10px;text-align:center;padding:5px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;font-family:'Noto Sans JP',sans-serif}
.ss-panel-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;min-height:0}
.ss-panel-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ss-panel-ph{color:rgba(255,255,255,.25);font-size:13px;text-align:center}
.ss-nav{background:rgba(14,21,32,.95);display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 16px;flex-shrink:0}
.ss-nav-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;width:46px;height:46px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;font-family:sans-serif;line-height:1}
.ss-nav-btn:hover:not(:disabled){background:rgba(255,255,255,.3)}
.ss-nav-btn:disabled{opacity:.25;cursor:not-allowed}
.ss-dots{display:flex;gap:6px;align-items:center}
.ss-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s;cursor:pointer}
.ss-dot.active{background:var(--accent)}

/* ── Camera Overlay ─────────────────────────────────────── */
.cam-overlay{position:fixed;inset:0;background:#000;z-index:450}
.cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
/* Sample overlay: inside crop frame */
.cam-sample-ov{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.cam-sample-ov img{width:100%;height:100%;object-fit:cover}
/* Grid: inside crop frame */
.cam-grid{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:33.333% 33.333%}
/* Crop frame: 4:3, shows exactly what gets captured */
.cam-crop-frame{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100vw;height:75vw;z-index:2;pointer-events:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.6);overflow:hidden}
@media(orientation:landscape){
  .cam-crop-frame{top:0;bottom:0;left:50%;transform:translateX(-50%);height:100vh;width:calc(100vh * 4 / 3);right:auto}
}
.cam-guide{position:absolute;top:0;left:0;right:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);color:#fff;font-size:13px;text-align:center;padding:14px 16px 40px;line-height:1.7;z-index:3;font-family:'Noto Sans JP',sans-serif}
@media(orientation:landscape){.cam-guide{top:0;bottom:68px;right:auto;width:auto;background:linear-gradient(to right,rgba(0,0,0,.45),transparent);padding:16px 28px 16px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center;writing-mode:vertical-rl;transform:none;font-size:12px;text-align:center}}
.cam-footer{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);padding:14px 24px 28px;display:flex;align-items:center;justify-content:space-between;z-index:3;gap:12px}
.cam-zoom-btns{display:flex;gap:6px;align-items:center}
.cam-zoom-btn{padding:6px 12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;font-weight:600}
.cam-zoom-btn.active{background:rgba(255,221,0,.35);border-color:#ffdd00;color:#ffdd00}
/* Tap-to-focus ring */
.cam-focus-ring{position:absolute;width:68px;height:68px;border:2px solid rgba(255,255,255,.9);border-radius:5px;pointer-events:none;z-index:20;transform:translate(-50%,-50%) scale(1.4);opacity:0;transition:transform .18s ease,opacity .18s ease}
.cam-focus-ring.active{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cam-focus-ring.locked{border-color:#ffdd00;box-shadow:0 0 0 1px rgba(255,221,0,.4)}
.cam-cancel{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:10px 16px;font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}
.cam-shutter{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.95);cursor:pointer;position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.28);transition:transform .12s;flex-shrink:0}
.cam-shutter:active{transform:scale(.91)}
.cam-shutter::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.cam-alpha-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.cam-alpha-lbl{color:rgba(255,255,255,.65);font-size:11px;white-space:nowrap;font-family:'Noto Sans JP',sans-serif}
.cam-alpha{-webkit-appearance:none;width:84px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;outline:none;cursor:pointer}
.cam-alpha::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer}
/* Level indicator — iOS style: fixed center, rotates to show tilt */
.cam-level-line{position:absolute;left:33.333%;right:33.333%;height:2px;top:50%;transform:translateY(-50%) rotate(0deg);transform-origin:center center;z-index:4;pointer-events:none;transition:background .2s,box-shadow .2s;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6),0 0 2px #fff}
.cam-level-label{display:none}

/* ── Second photo bar ──────────────────────────────────────── */
.sp2-bar{padding:8px 10px 10px;border-top:1px dashed var(--border);background:#edf2f8}
.sp2-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.sp2-cell{display:flex;flex-direction:column}
.sp2-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;text-align:center}
.sp2-frame{width:100%;aspect-ratio:4/3;background:var(--bg);border-radius:5px;overflow:hidden;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);position:relative}
.sp2-frame img{width:100%;height:100%;object-fit:cover}
.sp2-shoot-btn{padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:background .2s}
.sp2-shoot-btn:hover{background:#1a6bbf}

/* ── Slideshow eval panel ──────────────────────────────────── */
.ss-eval-panel{flex:0 0 200px;display:flex;flex-direction:column;padding:10px;background:rgba(0,0,0,.45);border-left:2px solid rgba(255,255,255,.1);gap:8px;overflow-y:auto;min-width:0}
.ss-mark-row{display:flex;gap:6px;justify-content:center}
.ss-mark-btn{width:46px;height:46px;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);font-size:20px;cursor:pointer;color:#fff;transition:all .15s;display:flex;align-items:center;justify-content:center}
.ss-mark-btn:hover{border-color:rgba(255,255,255,.7)}
.ss-mark-btn.sel-maru{border-color:#18945e!important;background:#18945e55;box-shadow:0 0 0 2px #18945e}
.ss-mark-btn.sel-sank{border-color:#e67e22!important;background:#e67e2255;box-shadow:0 0 0 2px #e67e22}
.ss-mark-btn.sel-batu{border-color:#c0392b!important;background:#c0392b55;box-shadow:0 0 0 2px #c0392b}
.ss-eval-lbl{color:rgba(255,255,255,.55);font-size:10px;font-family:'Noto Sans JP',sans-serif}
.ss-eval-comment{width:100%;padding:7px 9px;border:1px solid rgba(255,255,255,.2);border-radius:6px;font-size:12px;font-family:'Noto Sans JP',sans-serif;resize:none;height:68px;background:rgba(255,255,255,.1);color:#fff}
.ss-eval-comment::placeholder{color:rgba(255,255,255,.3)}
.ss-eval-comment:focus{outline:none;border-color:rgba(255,255,255,.5)}
.ss-trans-btn{padding:6px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:background .2s}
.ss-trans-btn:hover{background:#1a6bbf}
.ss-trans-result{font-size:11px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:5px 8px;border-radius:5px;line-height:1.5;display:none}
.ss-trans-result.show{display:block}
.ss-save-btn-inner{width:100%;padding:8px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-top:auto}
.ss-save-btn-inner:hover{background:var(--accent)}
/* Photo+draw wrap in slideshow */
.ss-photo-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
.ss-photo-wrap .ss-panel-img{position:absolute;inset:0;flex:none;width:100%;height:100%}
.ss-draw-canvas-ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:5;display:none}

/* ── My Page ────────────────────────────────────────────────── */
.mp-search{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:14px}
.mp-search-row{display:flex;gap:6px;width:100%;min-width:0;box-sizing:border-box}
.mp-name-input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Noto Sans JP',sans-serif;background:var(--bg)}
.mp-name-input:focus{outline:none;border-color:var(--accent)}
.mp-search-btn{flex-shrink:0;width:44px;height:44px;padding:0;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:18px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* card */
.mp-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.mp-card-hdr{background:var(--primary);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px}
/* photo row — 2 or 3 cols */
.mp-photos{display:grid;gap:0;border-bottom:1px solid var(--border)}
.mp-photos.cols2{grid-template-columns:1fr 1fr}
.mp-photos.cols3{grid-template-columns:1fr 1fr 1fr}
.mp-pcell{padding:6px;display:flex;flex-direction:column;gap:4px}
.mp-pcell+.mp-pcell{border-left:1px solid var(--border)}
.mp-plbl{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:center}
.mp-frame{width:100%;aspect-ratio:4/3;background:var(--bg);border-radius:6px;overflow:hidden;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);position:relative}
.mp-frame img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.mp-shoot-btn{width:100%;padding:5px 8px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-size:10px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-top:2px}
.mp-shoot-btn:hover{background:#1a6bbf}
/* eval row */
.mp-eval{padding:8px 10px 10px;display:flex;gap:10px;align-items:flex-start}
.mp-mark-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border:2px solid;flex-shrink:0}
.mp-mark-badge.maru{background:#e8f5ef;border-color:#18945e;color:#18945e}
.mp-mark-badge.sank{background:#fef5e7;border-color:#e67e22;color:#e67e22}
.mp-mark-badge.batu{background:#fdeded;border-color:#c0392b;color:#c0392b}

function compress(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        // 4:3 center crop
        const cropAR = 4 / 3;
        let iw = img.width, ih = img.height;
        let sx, sy, sw, sh;
        if (iw / ih > cropAR) { sh = ih; sw = Math.round(ih * cropAR); sx = Math.round((iw - sw) / 2); sy = 0; }
        else                  { sw = iw; sh = Math.round(iw / cropAR); sx = 0; sy = Math.round((ih - sh) / 2); }
        const outW = Math.min(sw, 1600);
        const outH = Math.round(sh * outW / sw);
        const c = document.createElement('canvas');
        c.width = outW; c.height = outH;
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        resolve(c.toDataURL('image/jpeg', 1.0));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('ja-JP', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// ── VIEW SWITCH ─────────────────────────────────────────────
function switchView(view) {
  if (view === 'admin' && !adminUnlocked) {
    document.getElementById('pw-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('pw-input').focus(), 100);
    return;
  }
  currentView = view;
  document.getElementById('participant-view').style.display = view === 'participant' ? 'block' : 'none';
  document.getElementById('mypage-view').style.display = view === 'mypage' ? 'block' : 'none';
  document.getElementById('admin-view').style.display = view === 'admin' ? 'block' : 'none';
  document.getElementById('review-view').style.display = view === 'review' ? 'block' : 'none';
  document.getElementById('tab-p').classList.toggle('active', view === 'participant');
  document.getElementById('tab-m').classList.toggle('active', view === 'mypage');
  document.getElementById('tab-a').classList.toggle('active', view === 'admin');
  if (view === 'participant') renderParticipant();
  if (view === 'admin') renderAdmin();
  if (view === 'mypage') renderMyPage();
}

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PW) {
    adminUnlocked = true;
    document.getElementById('pw-modal').style.display = 'none';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-err').style.display = 'none';
    switchView('admin');
  } else {
    document.getElementById('pw-err').style.display = 'block';
  }
}

  const {data} = await supa.from('samples').select('cat_id,data_url').eq('session_id', SESSION_ID);
  samples = {};
  if (data) data.forEach(s => { samples[s.cat_id] = s.data_url; });
}

async function saveSample(catId, dataUrl) {
  await supa.from('samples').upsert({
    id: `${SESSION_ID}_${catId}`,
    session_id: SESSION_ID,
    cat_id: catId,
    data_url: dataUrl
  });
  samples[catId] = dataUrl;
}

        <div class="photo-slot">
          <div class="slot-label">あなたの写真 / 내 사진</div>

            ${m ? `<img src="${m}" alt="my photo">` : `<div class="frame-ph"><span class="icon">📷</span><span>写真を選択</span></div>`}
          </div>

      <div class="progress-txt">${uploaded} / ${TOTAL} 枚アップロード済み</div>
      <button class="submit-btn" id="submit-btn" onclick="doSubmit()" ${uploaded===0?'disabled':''}>
        提出する（${uploaded}/${TOTAL}枚）
      </button>
      <div class="hint">※ 全${TOTAL}枚でなくても提出できます / 전체가 아니어도 제출 가능합니다</div>

async function handleMyPhoto(catId, input) {
  if (!input.files[0]) return;
  // ★ Fix: save name before re-render, restore after
  const savedName = document.getElementById('p-name')?.value || '';
  try {
    const dataUrl = await compress(input.files[0]);
    myPhotos[catId] = dataUrl;
    await renderParticipant();
    const nameEl = document.getElementById('p-name');
    if (nameEl && savedName) nameEl.value = savedName;
  } catch(e) { toast('画像の読み込みに失敗しました'); }
}

async function doSubmit() {
  const name = document.getElementById('p-name')?.value?.trim();
  if (!name) { toast('お名前を入力してください'); return; }
  const photoCount = Object.keys(myPhotos).length;
  if (photoCount === 0) { toast('写真を1枚以上選択してください'); return; }

  const btn = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '提出中... ⏳'; }

  try {
    const sid = `${SESSION_ID}_${Date.now()}_${Math.random().toString(36).slice(2,5)}`;
    const categories = Object.keys(myPhotos);

    const {error: e1} = await supa.from('submissions').insert({
      id: sid, session_id: SESSION_ID,
      participant_name: name, photo_count: photoCount, categories
    });
    if (e1) throw e1;

    const rows = Object.entries(myPhotos).map(([catId, dataUrl]) => ({
      id: `${sid}_${catId}`, submission_id: sid,
      session_id: SESSION_ID, cat_id: catId, data_url: dataUrl
    }));
    const {error: e2} = await supa.from('photos').insert(rows);
    if (e2) throw e2;

    submitted = true;
    renderSuccess(document.getElementById('participant-view'));
  } catch(e) {
    console.error(e);
    toast('エラーが発生しました。もう一度お試しください。');
    if (btn) { btn.disabled = false; btn.textContent = `提出する（${Object.keys(myPhotos).length}/${TOTAL}枚）`; }
  }
}

function renderSuccess(v) {
  v.innerHTML = `
    <div class="success-screen">
      <div class="success-icon">✅</div>
      <div class="success-title">提出完了！</div>
      <div class="success-sub">写真の提出が完了しました。<br>ありがとうございました！<br><br>사진이 제출되었습니다.<br>감사합니다!</div>
      <button class="reset-btn" onclick="resetParticipant()">別の参加者で再提出</button>

}

function resetParticipant() {
  submitted = false;
  myPhotos = {};
  renderParticipant();
}

// ── PDF EXPORT ───────────────────────────────────────────────
async function downloadPDF() {
  const btn = document.getElementById('pdf-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 生成中...'; }
  toast('PDFを生成中... しばらくお待ちください');

  try {
    const { jsPDF } = window.jspdf;
    // Use 16:9 custom page in pt (1200×675 pt ≈ 16×9)
    const PW = 1200, PH = 675;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [PH, PW] });

    for (let i = 0; i < CATS.length; i++) {
      const cat = CATS[i];
      if (i > 0) doc.addPage([PH, PW], 'landscape');

      // Render slide to canvas, add to PDF
      const canvas = await renderPageCanvas(cat,
        currentReviewSamples[cat.id] || null,
        currentReviewPhotos[cat.id]  || null,
        currentReviewName);

      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      doc.addImage(imgData, 'JPEG', 0, 0, PW, PH, undefined, 'FAST');
    }

    const safeName = currentReviewName.replace(/\s+/g, '_');
    doc.save(`${safeName}_S8_顔貌.pdf`);
    toast('✅ PDF保存完了');
  } catch(e) {
    console.error(e);
    toast('PDF生成に失敗しました');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📄 PDF'; }
  }
}

async function renderPageCanvas(cat, sUrl, pUrl, name) {
  const W = 1600, H = 900;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, W, H);

  // Header bar
  const HDR = 72;
  ctx.fillStyle = PRIMARY_HEX;
  ctx.fillRect(0, 0, W, HDR);

  // Accent line
  ctx.fillStyle = ACCENT_HEX;
  ctx.fillRect(0, HDR, W, 3);

  // Header text
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(name, 22, HDR / 2);

  ctx.font = '22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${cat.n}.  ${cat.jp}  /  ${cat.kr}`, W / 2, HDR / 2);

  ctx.font = '16px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'right';
  ctx.fillText(SESSION_LABEL, W - 22, HDR / 2);

  // Column areas
  const GAP = 4;
  const COL_TOP = HDR + 3 + 36;
  const COL_H = H - COL_TOP - 24;
  const COL_W = (W - GAP) / 2;

  // Column labels
  ctx.font = '16px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.textAlign = 'center';
  ctx.fillText('サンプル / 샘플', COL_W / 2, HDR + 3 + 18);
  ctx.fillText('提出写真 / 제출 사진', COL_W + GAP + COL_W / 2, HDR + 3 + 18);

  // Centre divider
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(COL_W, HDR + 3, GAP, H - HDR - 3);

  // Draw each photo with aspect-ratio-aware fit
  async function drawPhoto(dataUrl, x, y, maxW, maxH, placeholder) {
    if (!dataUrl) {
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(x + 10, y + 10, maxW - 20, maxH - 20);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(placeholder, x + maxW / 2, y + maxH / 2);
      return;
    }
    try {
      const img = await loadImage(dataUrl);
      const ratio = Math.min((maxW - 20) / img.naturalWidth, (maxH - 20) / img.naturalHeight);
      const dw = img.naturalWidth * ratio;
      const dh = img.naturalHeight * ratio;
      const dx = x + (maxW - dw) / 2;
      const dy = y + (maxH - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
    } catch(e) {}
  }

  await drawPhoto(sUrl, 0,          COL_TOP, COL_W, COL_H, '未登録');
  await drawPhoto(pUrl, COL_W + GAP, COL_TOP, COL_W, COL_H, '未提出');

  return canvas;
}

// ── SLIDESHOW ─────────────────────────────────────────────────
function openSlideshow() {
  slideIdx = 0;
  ssCanvasHandlersAttached = false; // reset so setupSsDrawCanvas re-attaches
  const ov = document.getElementById('ss-overlay');
  ov.style.display = 'flex';
  setupSsDrawCanvas();
  renderSlide();
  document.addEventListener('keydown', ssKeydown);
}

function closeSlideshow() {
  saveCurrentSsDrawing();
  document.getElementById('ss-overlay').style.display = 'none';
  document.removeEventListener('keydown', ssKeydown);
  ssDrawCatId = null;
}

function ssKeydown(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
  else if (e.key === 'Escape') closeSlideshow();
}

function renderSlide() {
  saveCurrentSsDrawing(); // persist drawing for the slide we're leaving
  const cat = CATS[slideIdx];
  const s = currentReviewSamples[cat.id] || null;
  const p = currentReviewPhotos[cat.id] || null;

  document.getElementById('ss-name').textContent = currentReviewName;
  document.getElementById('ss-cat').textContent  = `${cat.n}.  ${cat.jp}  /  ${cat.kr}`;
  document.getElementById('ss-counter').textContent = `${slideIdx + 1} / ${CATS.length}`;

  document.getElementById('ss-sample-img').innerHTML = s
    ? `<img src="${s}" alt="sample">`
    : `<span class="ss-panel-ph">未登録</span>`;
  document.getElementById('ss-photo-img').innerHTML = p
    ? `<img src="${p}" alt="submitted">`
    : `<span class="ss-panel-ph">未提出</span>`;

  document.getElementById('ss-prev').disabled = slideIdx === 0;
  document.getElementById('ss-next').disabled = slideIdx === CATS.length - 1;

  // Dots
  const dotsEl = document.getElementById('ss-dots');
  dotsEl.innerHTML = CATS.map((c, i) =>
    `<div class="ss-dot${i===slideIdx?' active':''}" onclick="gotoSlide(${i})"></div>`
  ).join('');

  // Populate eval panel
  const ev = evalState[cat.id] || {};
  const cur = ev.mark || '';
  document.getElementById('ss-mark-maru')?.classList.toggle('sel-maru', cur === '○');
  document.getElementById('ss-mark-sank')?.classList.toggle('sel-sank', cur === '△');
  document.getElementById('ss-mark-batu')?.classList.toggle('sel-batu', cur === '×');
  const commentEl = document.getElementById('ss-eval-comment');
  if (commentEl) commentEl.value = ev.comment_ko || '';
  const transEl = document.getElementById('ss-trans-result');
  if (transEl) { transEl.textContent = ev.comment_ja || ''; transEl.className = 'ss-trans-result' + (ev.comment_ja ? ' show' : ''); }

  // Init draw canvas for this slide (after a brief layout tick)
  setTimeout(() => initSsDrawCanvas(cat.id), 30);
}

function nextSlide() { if (slideIdx < CATS.length - 1) { slideIdx++; renderSlide(); } }
function prevSlide() { if (slideIdx > 0) { slideIdx--; renderSlide(); } }
function gotoSlide(i) { slideIdx = i; renderSlide(); }

function ssTouchStart(e) { ssStartX = e.touches[0].clientX; }
function ssTouchEnd(e) {
  const dx = e.changedTouches[0].clientX - ssStartX;
  if (Math.abs(dx) > 50) { dx < 0 ? nextSlide() : prevSlide(); }
}

// ── SLIDESHOW DRAW + EVAL ─────────────────────────────────────
function setupSsDrawCanvas() {
  if (ssCanvasHandlersAttached) return;
  const canvas = document.getElementById('ss-draw-canvas');
  if (!canvas) return;
  ssDrawCanvas = canvas;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width),
             y: (src.clientY - r.top)  * (canvas.height / r.height) };
  }
  function onStart(e) { e.preventDefault(); const p = getPos(e); ssDrawing=true; ssDrawLX=p.x; ssDrawLY=p.y; }
  function onMove(e) {
    e.preventDefault();
    if (!ssDrawing) return;
    const p = getPos(e);
    const ctx = ssDrawCanvas.getContext('2d');
    ctx.globalCompositeOperation = drawTool==='eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = drawColor;
    ctx.lineWidth   = drawTool==='eraser' ? drawLineWidth*4 : drawLineWidth;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ssDrawLX, ssDrawLY); ctx.lineTo(p.x, p.y); ctx.stroke();
    ssDrawLX=p.x; ssDrawLY=p.y;
  }
  function onEnd(e) {
    e.preventDefault(); ssDrawing=false;
    if (ssDrawCatId) drawState[ssDrawCatId] = ssDrawCanvas.toDataURL('image/png');
  }
  canvas.addEventListener('pointerdown',  onStart);
  canvas.addEventListener('pointermove',  onMove);
  canvas.addEventListener('pointerup',    onEnd);
  canvas.addEventListener('pointerleave', onEnd);
  canvas.addEventListener('touchstart',   onStart, {passive:false});
  canvas.addEventListener('touchmove',    onMove,  {passive:false});
  canvas.addEventListener('touchend',     onEnd,   {passive:false});
  ssCanvasHandlersAttached = true;
}

function initSsDrawCanvas(catId) {
  ssDrawCatId = catId;
  const canvas = document.getElementById('ss-draw-canvas');
  if (!canvas) return;
  ssDrawCanvas = canvas;
  const wrap = canvas.parentElement;
  const r = wrap.getBoundingClientRect();
  if (r.width === 0) return; // not visible yet
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(r.width  * dpr);
  canvas.height = Math.round(r.height * dpr);
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (drawState[catId]) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = drawState[catId];
  }
}

function saveCurrentSsDrawing() {
  if (!ssDrawCatId || !ssDrawCanvas || ssDrawCanvas.width === 0) return;
  drawState[ssDrawCatId] = ssDrawCanvas.toDataURL('image/png');
}

function ssMark(mark) {
  const cat = CATS[slideIdx];
  if (!cat || !evalState[cat.id]) return;
  evalState[cat.id].mark = evalState[cat.id].mark === mark ? '' : mark;
  const cur = evalState[cat.id].mark;

let nativeZoomSupported = false;

// ── TAP-TO-FOCUS ─────────────────────────────────────────────
let focusRingTimer = null;
async function tapToFocus(e) {
  if (!camStream) return;
  // Don't trigger on button taps
  if (e.target.closest('button') || e.target.closest('.cam-zoom-btns')) return;
  const overlay = document.getElementById('cam-overlay');
  const rect = overlay.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  const tx = src.clientX - rect.left;
  const ty = src.clientY - rect.top;
  const ring = document.getElementById('cam-focus-ring');
  if (!ring) return;
  // Reset animation
  ring.classList.remove('active','locked');
  ring.style.left = tx + 'px';
  ring.style.top  = ty + 'px';
  void ring.offsetWidth; // reflow
  ring.classList.add('active');
  clearTimeout(focusRingTimer);
  // Try native pointOfInterest focus
  const track = camStream.getVideoTracks()[0];
  if (track) {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.pointOfInterest || caps.focusMode) {
      const x = Math.min(Math.max(tx / rect.width, 0), 1);
      const y = Math.min(Math.max(ty / rect.height, 0), 1);
      try {
        const constraints = { advanced: [{ pointOfInterest: { x, y }, focusMode: 'manual' }] };
        await track.applyConstraints(constraints);
        focusRingTimer = setTimeout(() => { ring.classList.add('locked'); }, 350);
        focusRingTimer = setTimeout(() => { ring.classList.remove('active','locked'); }, 2200);
        return;
      } catch(_) {}
    }
  }
  // Fallback: just show focus indicator
  ring.classList.add('locked');
  focusRingTimer = setTimeout(() => { ring.classList.remove('active','locked'); }, 1400);
}

async function setZoom(level) {
  currentZoom = level;
  document.querySelectorAll('.cam-zoom-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.zoom) === level);
  });
  const vid = document.getElementById('cam-video');
  if (!vid || !camStream) return;
  const track = camStream.getVideoTracks()[0];
  if (track) {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps && caps.zoom) {
      nativeZoomSupported = true;
      const z = Math.min(Math.max(level, caps.zoom.min), caps.zoom.max);
      try {
        await track.applyConstraints({ advanced: [{ zoom: z }] });
        vid.style.transform = '';
        vid.style.transformOrigin = '';
        return;
      } catch(e) { nativeZoomSupported = false; }
    }
  }
  nativeZoomSupported = false;
  if (level > 1) {
    vid.style.transform = `scale(${level})`;
    vid.style.transformOrigin = 'center center';
  } else {
    vid.style.transform = '';
    vid.style.transformOrigin = '';
  }
}

// ─ Level indicator ─
function getScreenTilt(e) {
  // Returns the left-right tilt angle relative to current screen orientation
  const gamma = e.gamma || 0;
  const beta  = e.beta  || 0;
  const angle = (() => {
    if (screen.orientation && screen.orientation.angle != null) return screen.orientation.angle;
    return (typeof window.orientation !== 'undefined' ? window.orientation : 0);
  })();
  const a = ((Math.round(angle) % 360) + 360) % 360;
  if (a === 90)  return -beta;   // landscape right (rotated CW 90°)
  if (a === 270) return  beta;   // landscape left  (rotated CCW 90°)
  if (a === 180) return -gamma;  // portrait upside-down
  return gamma;                  // portrait normal
}

function startLevelIndicator() {
  const line  = document.getElementById('cam-level-line');
  const label = document.getElementById('cam-level-label');
  if (!line) return;
  let smoothed = 0;
  let rafId = null;
  let pendingTilt = 0;
  function applyTilt() {
    rafId = null;
    const lv  = Math.abs(smoothed) < 2;
    const col = lv ? '#ffdd00' : '#ffffff';
    line.style.transform = `translateY(-50%) rotate(${-smoothed}deg)`;
    line.style.background = col;
    line.style.boxShadow  = lv
      ? `0 0 10px #ffdd0099,0 0 3px #ffdd00`
      : `0 0 6px rgba(255,255,255,.5),0 0 2px #fff`;
    if (label) { label.style.color = col; label.textContent = Math.abs(smoothed).toFixed(1) + '°'; }
  }
  function onOrientation(e) {
    const raw = getScreenTilt(e);
    // EMA low-pass filter: α=0.12 → heavy smoothing, no jitter
    smoothed = 0.12 * raw + 0.88 * smoothed;
    if (!rafId) rafId = requestAnimationFrame(applyTilt);
  }
  levelHandler = onOrientation;
  window.addEventListener('deviceorientation', levelHandler);
}

function stopLevelIndicator() {
  if (levelHandler) { window.removeEventListener('deviceorientation', levelHandler); levelHandler = null; }
}

async function openCameraOverlay(catId, mode) {
  camCatId = catId;
  camMode  = mode || 'main';
  const ov = document.getElementById('cam-overlay');
  ov.style.display = 'block';

  // Request gyroscope permission on iOS 13+
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm === 'granted') startLevelIndicator();
    } catch(e) { startLevelIndicator(); }
  } else {
    startLevelIndicator();
  }

  // ── Fullscreen: hide browser chrome on mobile ──
  try {
    const de = document.documentElement;
    if (de.requestFullscreen)            await de.requestFullscreen();
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
  } catch(e) {}

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
    const vid = document.getElementById('cam-video');
    vid.srcObject = camStream;
    vid.addEventListener('loadedmetadata', () => { vid.play().catch(() => {}); setZoom(1); }, { once: true });
    vid.play().catch(() => {});
    // ── Macro prevention: enforce zoom≥1 to block ultra-wide/macro lens ──
    const track = camStream.getVideoTracks()[0];
    if (track) {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) {
        try { await track.applyConstraints({ advanced: [{ zoom: Math.max(1, caps.zoom.min || 0) }] }); } catch(_) {}
      }
    }
    // Guard interval: if iOS auto-switches to macro (<1×), correct it
    macroGuardId = setInterval(async () => {
      if (!camStream) return;
      const t = camStream.getVideoTracks()[0];
      if (!t) return;
      const settings = t.getSettings ? t.getSettings() : {};
      if (settings.zoom !== undefined && settings.zoom < 0.99) {
        try { await t.applyConstraints({ advanced: [{ zoom: 1 }] }); } catch(_) {}
      }
    }, 600);
  } catch(e) {
    closeCameraOverlay();
    toast('カメラにアクセスできません。ファイルを選択してください。');
    if (camMode === 'main') setTimeout(() => document.getElementById(`fi-${catId}`).click(), 300);
  }
}

function closeCameraOverlay() {
  stopLevelIndicator();
  if (macroGuardId) { clearInterval(macroGuardId); macroGuardId = null; }
  // ── Exit fullscreen if active ──
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  } catch(e) {}
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const v = document.getElementById('cam-video');
  if (v) { v.srcObject = null; v.style.transform = ''; v.style.transformOrigin = ''; }
  document.getElementById('cam-overlay').style.display = 'none';
  currentZoom = 1;
  nativeZoomSupported = false;
  camCatId = null;
}

// Close overlay if user exits fullscreen externally (e.g. swipe/home)
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    const ov = document.getElementById('cam-overlay');
    if (ov && ov.style.display !== 'none') closeCameraOverlay();
  }
});
document.addEventListener('webkitfullscreenchange', () => {
  if (!document.webkitFullscreenElement) {
    const ov = document.getElementById('cam-overlay');
    if (ov && ov.style.display !== 'none') closeCameraOverlay();
  }
});

async function capturePhoto() {
  const video = document.getElementById('cam-video');
  if (!video || !video.videoWidth) { toast('カメラの準備中です...'); return; }
  // Capture exactly the 4:3 crop frame shown on screen
  const vw = video.videoWidth, vh = video.videoHeight;
  const cropAR = 4 / 3;
  let cx, cy, cw, ch;
  const vAR = vw / vh;
  if (vAR > cropAR) { ch = vh; cw = Math.round(vh * cropAR); cx = Math.round((vw - cw) / 2); cy = 0; }
  else              { cw = vw; ch = Math.round(vw / cropAR); cx = 0; cy = Math.round((vh - ch) / 2); }
  // For CSS zoom fallback: crop the zoomed-in portion
  let drawCX = cx, drawCY = cy, drawCW = cw, drawCH = ch;
  if (!nativeZoomSupported && currentZoom > 1) {
    drawCW = cw / currentZoom;
    drawCH = ch / currentZoom;
    drawCX = cx + (cw - drawCW) / 2;
    drawCY = cy + (ch - drawCH) / 2;
  }
  const outW = Math.min(drawCW, 1600);
  const outH = Math.round(drawCH * outW / drawCW);
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  out.getContext('2d').drawImage(video, drawCX, drawCY, drawCW, drawCH, 0, 0, outW, outH);
  const dataUrl = out.toDataURL('image/jpeg', 1.0);
  const cid = camCatId;
  const mode = camMode;
  closeCameraOverlay();
  if (mode === 'mypage') {
    await mpSavePhoto2(cid, dataUrl);
  } else if (mode === 'second') {
    secondPhotos[cid] = dataUrl;
    const frame = document.getElementById(`sp2-frame-${cid}`);
    if (frame) frame.innerHTML = `<img src="${dataUrl}">`;
    toast('✅ 2枚目を撮影しました');
  } else {
    const savedName = document.getElementById('p-name')?.value || '';
    myPhotos[cid] = dataUrl;
    await renderParticipant();
    const nameEl = document.getElementById('p-name');
    if (nameEl && savedName) nameEl.value = savedName;
    toast('✅ 写真を撮影しました');
  }
}

// ── DRAWING ──────────────────────────────────────────────────
function setDrawTool(tool) {
  drawTool = tool;
  document.querySelectorAll('.draw-tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool===tool));
}
function setDrawColor(v) { drawColor = v; }
function setDrawWidth(v) { drawLineWidth = parseInt(v); }

function initDrawCanvas(catId) {
  const canvas = document.getElementById(`dc-${catId}`);
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = Math.round(rect.width  * (window.devicePixelRatio||1));
  canvas.height = Math.round(rect.height * (window.devicePixelRatio||1));
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cssW = rect.width, cssH = rect.height;
  if (drawState[catId]) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, cssW, cssH);
    img.src = drawState[catId];
  }
  const dc = {canvas, ctx, drawing:false, lx:0, ly:0};
  activeDrawCanvases[catId] = dc;
  function getPos(e) {
    const r2 = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {x: src.clientX - r2.left, y: src.clientY - r2.top};
  }
  function onStart(e) {
    e.preventDefault();
    const p = getPos(e); dc.drawing=true; dc.lx=p.x; dc.ly=p.y;
  }
  function onMove(e) {
    e.preventDefault();
    if (!dc.drawing) return;
    const p = getPos(e);
    ctx.globalCompositeOperation = drawTool==='eraser' ? 'destination-out':'source-over';
    ctx.strokeStyle = drawColor;
    ctx.lineWidth = drawTool==='eraser' ? drawLineWidth*4 : drawLineWidth;
    ctx.beginPath(); ctx.moveTo(dc.lx,dc.ly); ctx.lineTo(p.x,p.y); ctx.stroke();
    dc.lx=p.x; dc.ly=p.y;
  }
  function onEnd(e) {
    e.preventDefault(); dc.drawing=false;
    drawState[catId] = canvas.toDataURL('image/png');
  }
  canvas.addEventListener('pointerdown',onStart);
  canvas.addEventListener('pointermove',onMove);
  canvas.addEventListener('pointerup',onEnd);
  canvas.addEventListener('pointerleave',onEnd);
  canvas.addEventListener('touchstart',onStart,{passive:false});
  canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('touchend',onEnd,{passive:false});
}

function clearDrawing(catId) {
  const dc = activeDrawCanvases[catId];
  if (!dc) return;
  const r = dc.canvas.getBoundingClientRect();
  dc.ctx.clearRect(0, 0, r.width, r.height);
  drawState[catId] = null;
}

// ── EVAL PDF ─────────────────────────────────────────────────
async function downloadEvalPDF() {
  const btn = document.getElementById('eval-pdf-btn');
  if (btn) { btn.disabled=true; btn.textContent='⏳ 生成中...'; }
  toast('PDFを生成中...');
  try {
    const {jsPDF} = window.jspdf;
    const PW=1200, PH=675;
    const doc = new jsPDF({orientation:'landscape',unit:'pt',format:[PH,PW]});
    for (let i=0; i<CATS.length; i++) {
      if (i>0) doc.addPage([PH,PW],'landscape');
      const cat = CATS[i];
      const canvas = await renderEvalPageCanvas(
        cat,
        currentReviewSamples[cat.id]||null,
        currentReviewPhotos[cat.id]||null,
        drawState[cat.id]||null,
        evalState[cat.id]||{},
        currentReviewName
      );
      doc.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,PW,PH,undefined,'FAST');
    }
    doc.save(`${currentReviewName.replace(/\s+/g,'_')}_S8_評価.pdf`);
    toast('✅ PDF保存完了');
  } catch(e) { console.error(e); toast('PDF生成に失敗しました'); }
  finally { if (btn) { btn.disabled=false; btn.textContent='📄 PDF保存'; } }
}

async function renderEvalPageCanvas(cat, sUrl, pUrl, drawUrl, ev, name) {
  const W=1600, H=900;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const c = cv.getContext('2d');
  c.fillStyle='#0f172a'; c.fillRect(0,0,W,H);
  // Header
  const HDR=68;
  c.fillStyle=PRIMARY_HEX; c.fillRect(0,0,W,HDR);
  c.fillStyle=ACCENT_HEX;  c.fillRect(0,HDR,W,3);
  c.textBaseline='middle'; c.fillStyle='#fff';
  c.font='bold 22px sans-serif'; c.textAlign='left';   c.fillText(name,20,HDR/2);
  c.font='19px sans-serif';       c.textAlign='center'; c.fillText(`${cat.n}. ${cat.jp} / ${cat.kr}`,W/2,HDR/2);
  c.font='14px sans-serif';       c.fillStyle='rgba(255,255,255,.5)'; c.textAlign='right'; c.fillText(SESSION_LABEL,W-20,HDR/2);
  // 3-column layout: sample | photo+drawing | eval
  const BY=HDR+3, BH=H-BY-12;
  const CW=Math.floor((W-8)/3), G=4;
  // labels
  c.font='13px sans-serif'; c.fillStyle='rgba(255,255,255,.4)'; c.textBaseline='top';
  c.textAlign='center';
  c.fillText('サンプル', CW/2, BY+6);
  c.fillText('提出写真', CW+G+CW/2, BY+6);
  c.fillText('評価', CW*2+G*2+CW/2, BY+6);
  const IT=BY+26, IH=BH-26;
  c.fillStyle='rgba(255,255,255,.07)'; c.fillRect(CW,BY,G,BH); c.fillRect(CW*2+G,BY,G,BH);
  // Draw sample
  await drawImgFit(c, sUrl, 0, IT, CW, IH, '未登録');
  // Draw photo + drawing composite
  if (pUrl) {
    const tmp = document.createElement('canvas'); tmp.width=CW; tmp.height=IH;
    const tc = tmp.getContext('2d');
    await drawImgFit(tc, pUrl, 0, 0, CW, IH, '');
    if (drawUrl) {
      const di=new Image(); di.src=drawUrl;
      await new Promise(r=>{di.onload=r;di.onerror=r;});
      tc.drawImage(di,0,0,CW,IH);
    }
    c.drawImage(tmp, CW+G, IT);
  } else { await drawImgFit(c, null, CW+G, IT, CW, IH, '未提出'); }
  // Eval panel
  const EX=CW*2+G*2, EC=EX+CW/2;
  const sym = ev.mark||'';
  if (sym) {
    c.font='bold 90px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle = sym==='○'?'#18945e':sym==='△'?'#e67e22':'#c0392b';
    c.fillText(sym, EC, IT+90);
  }
  let ty = IT + (sym ? 200 : 40);
  if (ev.comment_ko) { c.fillStyle='#fff'; c.font='15px sans-serif'; c.textAlign='left'; c.textBaseline='top'; ty=wrapTxt(c,ev.comment_ko,EX+14,ty,CW-28,20)+8; }
  if (ev.comment_ja) { c.fillStyle='rgba(255,255,255,.55)'; c.font='13px sans-serif'; wrapTxt(c,'🇯🇵 '+ev.comment_ja,EX+14,ty,CW-28,18); }
  return cv;
}

function wrapTxt(c,text,x,y,maxW,lh) {
  if(!text)return y;
  let line='', ty=y;
  for(const ch of text){
    const t=line+ch;
    if(c.measureText(t).width>maxW&&line){c.fillText(line,x,ty);line=ch;ty+=lh;}
    else line=t;
  }
  if(line)c.fillText(line,x,ty);
  return ty+lh;
}

async function drawImgFit(ctx,url,x,y,mw,mh,ph){
  if(!url){
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2;
    ctx.setLineDash([8,6]); ctx.strokeRect(x+8,y+8,mw-16,mh-16); ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.font='16px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ph,x+mw/2,y+mh/2);
    return;
  }
  try {
    const img=await loadImage(url);
    const r=Math.min((mw-16)/img.naturalWidth,(mh-16)/img.naturalHeight);
    const dw=img.naturalWidth*r, dh=img.naturalHeight*r;
    ctx.drawImage(img,x+(mw-dw)/2,y+(mh-dh)/2,dw,dh);
  } catch(e){}
}

async function translateKoJa(text) {
  if (!text) return '';
  // Primary: MyMemory (free public API, no CORS issues, no key required)
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=ko|ja&de=myungjin.kim@minishtech.com';
    const r = await fetch(url);
    if (r.ok) {
      const j = await r.json();
      if (j?.responseStatus === 200 && j?.responseData?.translatedText) {
        return j.responseData.translatedText;
      }
    }
  } catch(e) {}
  // Fallback: DeepL
  try {
    const key = DEEPL_API_KEY;
    const ep = key.endsWith(':fx') ? 'https://api-free.deepl.com/v2/translate' : 'https://api.deepl.com/v2/translate';
    const r = await fetch(ep, {
      method: 'POST',
      headers: {'Authorization': `DeepL-Auth-Key ${key}`, 'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({text, source_lang:'KO', target_lang:'JA'})
    });
    if (r.ok) { const j = await r.json(); return j.translations?.[0]?.text || ''; }
  } catch(e) {}
  return '';
}

async function translateKoJaRetry(text, retries = 3) {
  for (let i = 0; i < retries; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, 1000 * i));
    const ja = await translateKoJa(text);
    if (ja) return ja;
  }
  return '';
}

async function mpSearch() {
  const name = document.getElementById('mp-name')?.value?.trim();
  if (!name) { toast('이름을 입력해 주세요'); return; }
  const res = document.getElementById('mp-result');
  res.innerHTML = '<div class="loading">🔍 検索中...</div>';

  const {data: subs, error: e1} = await supa.from('submissions')
    .select('*').eq('session_id', SESSION_ID)
    .ilike('participant_name', name)
    .order('created_at', {ascending:false}).limit(1);

  if (e1 || !subs?.length) {
    res.innerHTML = `<div class="section-box" style="text-align:center;color:var(--muted);padding:30px">
      ❌ "${name}"으로 제출한 내역이 없습니다<br><span style="font-size:11px">「${name}」の提出データが見つかりません</span>
    </div>`;
    return;
  }

  const sub = subs[0];
  mpSubmissionId = sub.id;

  // Load samples, photos, evals in parallel
  const [samplesRes, photosRes, evalsRes] = await Promise.all([
    supa.from('samples').select('cat_id,data_url').eq('session_id', SESSION_ID),
    supa.from('photos').select('cat_id,data_url').eq('submission_id', sub.id),
    supa.from('evaluations').select('*').eq('submission_id', sub.id)
  ]);
  mpSamples = {}; mpPhotos = {}; mpEvals = {};
  if (samplesRes.data) samplesRes.data.forEach(s => { mpSamples[s.cat_id] = s.data_url; });
  if (photosRes.data)  photosRes.data.forEach(p => { mpPhotos[p.cat_id] = p.data_url; });
  if (evalsRes.data)   evalsRes.data.forEach(ev => { mpEvals[ev.cat_id] = {...ev}; });

  // Auto-translate Korean comments that don't have Japanese yet
  res.innerHTML = '<div class="loading">🌐 번역 중...</div>';
  const toTranslate = CATS.filter(cat => {
    const ev = mpEvals[cat.id];
    return ev?.comment_ko && !ev?.comment_ja;
  });
  if (toTranslate.length) {
    for (const cat of toTranslate) {
      const ja = await translateKoJaRetry(mpEvals[cat.id].comment_ko);
      if (ja) mpEvals[cat.id].comment_ja = ja;
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  // Build HTML
  const ts = new Date(sub.created_at).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  let html = `<div class="section-box mp-result-hdr" style="padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="flex:1">👤 <strong>${sub.participant_name}</strong> <span style="font-size:11px;color:var(--muted);margin-left:6px">${ts} 提出</span></div>
    <button class="mp-action-btn mp-trans-all-btn" onclick="mpRetranslate()" id="mp-trans-all-btn">🌐 번역</button>
    <button class="mp-action-btn mp-pdf-btn" onclick="mpPrint()">📄 PDF저장</button>
  </div>`;

  for (const cat of CATS) {
    const sample  = mpSamples[cat.id] || '';
    const photo   = mpPhotos[cat.id]  || '';
    const ev      = mpEvals[cat.id]   || {};
    const mark    = ev.mark || '';
    const needsRetake = mark === '×';
    const hasPhoto2   = !!ev.photo2_data_url;
    const show3col    = needsRetake || hasPhoto2;
    const markCls     = mark==='○'?'maru':mark==='△'?'sank':mark==='×'?'batu':'none';
    const markLabel   = mark || '—';

    html += `
    <div class="mp-card">
      <div class="mp-card-hdr">
        <div class="cat-num">${cat.n}</div>
        <div class="cat-name">${cat.jp}</div>
        <div class="cat-sub" style="margin-left:auto">${cat.kr}</div>
      </div>
      <div class="mp-photos ${show3col?'cols3':'cols2'}">
        <div class="mp-pcell">
          <div class="mp-plbl">サンプル / 샘플</div>
          <div class="mp-frame">${sample?`<img src="${sample}">`:'<span>未登録</span>'}</div>
        </div>
        <div class="mp-pcell">
          <div class="mp-plbl">提出写真 / 제출사진</div>
          <div class="mp-frame">${photo?`<img src="${photo}">`:'<span>未提出</span>'}${photo&&ev.drawing_data_url?`<img src="${ev.drawing_data_url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none">`:''}
          </div>
        </div>
        ${show3col ? `
        <div class="mp-pcell">
          <div class="mp-plbl">2차사진 / 2枚目</div>
          <div class="mp-frame" id="mp-frame2-${cat.id}">${hasPhoto2?`<img src="${ev.photo2_data_url}">`:'<span style="font-size:9px;text-align:center">撮影が必要</span>'}</div>
          <button class="mp-shoot-btn" onclick="mpOpenCamera('${cat.id}')">📷 ${hasPhoto2?'再撮影':'2枚目撮影'}</button>
        </div>` : ''}
      </div>
      <div class="mp-eval">
        <div class="mp-mark-badge ${markCls}">${markLabel}</div>
        <div class="mp-comments">
          ${ev.comment_ko ? `<div class="mp-cmt-ko">${ev.comment_ko}</div>` : (!mark ? `<div style="font-size:11px;color:#bbb">평가 전</div>` : '')}
          ${ev.comment_ja
            ? `<div class="mp-cmt-ja" id="mp-ja-${cat.id}">🇯🇵 ${ev.comment_ja}</div>`
            : ev.comment_ko
              ? `<div id="mp-ja-${cat.id}"></div>`
              : ''}
        </div>
      </div>
    </div>`;
  }

  res.innerHTML = html;
}

function mpPrint() {
  window.print();
}

async function mpRetranslate() {
  const btn = document.getElementById('mp-trans-all-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 번역 중...'; }
  const tasks = CATS.filter(cat => mpEvals[cat.id]?.comment_ko);
  for (const cat of tasks) {
    const ja = await translateKoJaRetry(mpEvals[cat.id].comment_ko);
    if (ja) {
      mpEvals[cat.id].comment_ja = ja;
      const el = document.getElementById(`mp-ja-${cat.id}`);
      if (el) el.outerHTML = `<div class="mp-cmt-ja" id="mp-ja-${cat.id}">🇯🇵 ${ja}</div>`;
    }
    await new Promise(r => setTimeout(r, 1000));
  }
  if (btn) { btn.disabled = false; btn.textContent = '🌐 번역'; }
  toast('✅ 번역 완료');
}

async function mpTransCard(catId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '번역 중...'; }
  const ko = mpEvals[catId]?.comment_ko;
  if (!ko) return;
  const ja = await translateKoJa(ko);
  if (ja) {
    mpEvals[catId].comment_ja = ja;
    const el = document.getElementById(`mp-ja-${catId}`);
    if (el) el.outerHTML = `<div class="mp-cmt-ja" id="mp-ja-${catId}">🇯🇵 ${ja}</div>`;
  } else {
    if (btn) { btn.disabled = false; btn.textContent = '🌐 번역하기'; }
    toast('번역 실패 — 다시 시도해 주세요');
  }
}

function mpOpenCamera(catId) {
  showUploadChoice(catId, 'mypage');
}

async function mpSavePhoto2(catId, dataUrl) {
  const frame = document.getElementById(`mp-frame2-${catId}`);
  if (frame) frame.innerHTML = `<img src="${dataUrl}">`;
  toast('📤 저장 중...');
  const evId = `${mpSubmissionId}_${catId}`;
  const {error} = await supa.from('evaluations').upsert({
    id: evId,
    submission_id: mpSubmissionId,
    session_id: SESSION_ID,
    cat_id: catId,
    mark: mpEvals[catId]?.mark || null,
    comment_ko: mpEvals[catId]?.comment_ko || null,
    comment_ja: mpEvals[catId]?.comment_ja || null,
    photo2_data_url: dataUrl
  });
  if (error) { toast('保存エラー: ' + error.message); return; }
  if (!mpEvals[catId]) mpEvals[catId] = {};
  mpEvals[catId].photo2_data_url = dataUrl;
  toast('✅ 2차 사진 저장 완료！');
  const btn = document.querySelector(`button[onclick="mpOpenCamera('${catId}')"]`);
  if (btn) btn.textContent = '📷 再撮影';
}

// Remove Netlify badge (iframe + any element)
(function() {
  function removeNetlifyBadge() {
    document.querySelectorAll('iframe, a, div, span').forEach(function(el) {
      try {
        var src = el.src || el.href || el.getAttribute('src') || '';
        var text = el.textContent || '';
        var id = el.id || '';
        if (src.includes('netlify') || text.includes('Powered by Netlify') || id.includes('netlify')) {
          el.style.display = 'none';
          el.remove();
        }
      } catch(e) {}
    });
  }
  removeNetlifyBadge();
  setInterval(removeNetlifyBadge, 500);
  new MutationObserver(removeNetlifyBadge).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
