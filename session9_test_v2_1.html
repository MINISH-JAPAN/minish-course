<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINISH JAPAN 도쿄 42개 오피스 입지·통근 비교 맵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Interactive Vector Map Canvas */
    #tokyo-svg {
      user-select: none;
      touch-action: none;
    }
    .pin-group {
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pin-group:hover .pin-circle {
      stroke-width: 3.5px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .corridor-zone {
      transition: opacity 0.3s ease;
    }
    .rail-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Top Header -->
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 z-20 shrink-0 shadow-xs">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white font-black shadow-md text-lg">
        M
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-bold tracking-wider uppercase bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-md">MINISH JAPAN</span>
          <h1 class="text-sm sm:text-base font-extrabold text-slate-900">도쿄 4개 권역 42개 오피스 입지 & 대형 거주구역 통근 분석</h1>
        </div>
        <p class="text-[11px] text-slate-500 mt-0.5">Three Star 제안서 4종 통합 (미나토·시부야·메구로 / 치요다구 / 추오구 / 신주쿠구)</p>
      </div>
    </div>

    <!-- Header Stats & Layer Toggles -->
    <div class="flex items-center gap-2 text-xs">
      <button id="toggle-corridors-btn" onclick="toggleCorridorLayer()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-semibold border bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100 transition-colors">
        <i class="ph-fill ph-house-line text-sm"></i>
        <span>대형 거주구역(베드타운) 축 ON</span>
      </button>
      <button onclick="resetMapView()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">
        <i class="ph-bold ph-arrows-out-cardinal"></i>
        <span class="hidden sm:inline">전체 지도</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- Left Sidebar: Search, Filters, Property List -->
    <aside class="w-full lg:w-[480px] xl:w-[520px] bg-white border-r border-slate-200 flex flex-col h-[52%] lg:h-full z-10 shrink-0 shadow-sm">
      
      <!-- Filter & Control Panel -->
      <div class="p-3.5 bg-slate-50/90 border-b border-slate-200 space-y-2.5 shrink-0">
        
        <!-- Group Tabs (4 PDFs) -->
        <div class="flex flex-wrap gap-1.5 text-[11px] font-bold">
          <button onclick="setGroupFilter('ALL')" id="tab-ALL" class="group-tab px-2.5 py-1.5 rounded-lg bg-slate-900 text-white shadow-xs transition-all">
            전체 (42)
          </button>
          <button onclick="setGroupFilter('A')" id="tab-A" class="group-tab px-2.5 py-1.5 rounded-lg bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition-all flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-rose-500"></span> 미나토·시부야·메구로 (12)
          </button>
          <button onclick="setGroupFilter('B')" id="tab-B" class="group-tab px-2.5 py-1.5 rounded-lg bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition-all flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-blue-600"></span> 치요다구 (12)
          </button>
          <button onclick="setGroupFilter('C')" id="tab-C" class="group-tab px-2.5 py-1.5 rounded-lg bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition-all flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-600"></span> 추오구 (12)
          </button>
          <button onclick="setGroupFilter('D')" id="tab-D" class="group-tab px-2.5 py-1.5 rounded-lg bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition-all flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span> 신주쿠구 (6)
          </button>
        </div>

        <!-- Commuter Corridor Filter & Sort -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <select id="corridor-filter" onchange="applyFilters()" class="text-xs bg-white border border-slate-200 rounded-xl px-2.5 py-2 font-medium text-slate-700 focus:outline-none focus:border-blue-500">
            <option value="ALL">🏠 거주구역 통근축 전체 보기</option>
            <option value="JONAN">① 조난·도큐선 축 (세타가야·메구로·요코하마)</option>
            <option value="JOSAI">② 조사이·주오·게이오 축 (나카노·스기나미·기치조지)</option>
            <option value="JOHOKU">③ 조호쿠·사이쿄·미타 축 (이케부쿠로·이타바시·사이타마)</option>
            <option value="JOTO">④ 조토·소부·도자이 축 (후나바시·이치카와·지바)</option>
            <option value="WANGAN">⑤ 완간·유라쿠초·오에도 축 (도요스·가치도키·고토구)</option>
          </select>

          <select id="sort-select" onchange="applyFilters()" class="text-xs bg-white border border-slate-200 rounded-xl px-2.5 py-2 font-medium text-slate-700 focus:outline-none focus:border-blue-500">
            <option value="id-asc">📋 기본 번호순 (1 ~ 42번)</option>
            <option value="rent-asc">💴 월 임대료 낮은순</option>
            <option value="pyung-price-asc">📉 평당 단가 낮은순 (가성비)</option>
            <option value="area-desc">📐 전용 면적 넓은순</option>
            <option value="walk-asc">🚶 역 도보 거리 가까운순</option>
            <option value="deposit-zero">✨ 보증금 0개월 우선</option>
          </select>
        </div>

        <!-- Search Box & Count -->
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="search-input" oninput="applyFilters()" placeholder="빌딩명, 역명(신바시, 간다, 긴자, 신주쿠), 거주구역 검색..." class="w-full text-xs bg-white border border-slate-200 rounded-xl pl-8 pr-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
          <span id="result-badge" class="text-[11px] font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-2 rounded-xl shrink-0">
            42건
          </span>
        </div>
      </div>

      <!-- Scrollable List -->
      <div id="property-list" class="flex-1 overflow-y-auto p-3.5 space-y-3 bg-slate-50/40">
        <!-- Cards rendered via JS -->
      </div>
    </aside>

    <!-- Right Area: Interactive Vector Map & Floating Inspector -->
    <main class="flex-1 relative h-[48%] lg:h-full bg-[#e9eff5] overflow-hidden flex flex-col">
      
      <!-- Zoom Controls -->
      <div class="absolute top-4 right-4 z-20 flex flex-col gap-1.5 bg-white/95 backdrop-blur-md p-1.5 rounded-2xl shadow-lg border border-slate-200">
        <button onclick="zoomMap(1.3)" title="확대" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold transition-colors">
          <i class="ph-bold ph-plus text-base"></i>
        </button>
        <button onclick="zoomMap(0.77)" title="축소" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold transition-colors">
          <i class="ph-bold ph-minus text-base"></i>
        </button>
        <div class="h-px bg-slate-200 mx-1"></div>
        <button onclick="resetMapView()" title="초기 위치" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold transition-colors">
          <i class="ph-bold ph-compass text-base"></i>
        </button>
      </div>

      <!-- Map Legend (Top Left) -->
      <div class="absolute top-4 left-4 z-20 bg-white/95 backdrop-blur-md rounded-2xl p-3 shadow-md border border-slate-200/90 text-[11px] max-w-[260px] hidden sm:block">
        <div class="font-extrabold text-slate-800 mb-1.5 flex items-center gap-1.5">
          <i class="ph-fill ph-map-pin text-blue-600"></i> PDF 권역별 마커 색상
        </div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-slate-600 font-medium">
          <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>1~12 미나토·시부야</div>
          <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>13~24 치요다구</div>
          <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>25~36 추오구</div>
          <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>37~42 신주쿠구</div>
        </div>
        <div class="mt-2 pt-1.5 border-t border-slate-100 text-[10px] text-slate-400">
          * 마우스 드래그 이동 · 휠 확대/축소 지원
        </div>
      </div>

      <!-- Interactive SVG Vector Map -->
      <svg id="tokyo-svg" viewBox="0 0 1200 900" class="w-full h-full cursor-grab active:cursor-grabbing">
        <defs>
          <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dbe4ee" stroke-width="0.8"/>
          </pattern>
          <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
          </filter>
        </defs>

        <!-- Background Grid -->
        <rect width="1200" height="900" fill="#eef3f8" />
        <rect width="1200" height="900" fill="url(#grid-pattern)" />

        <!-- Pannable & Zoomable World Group -->
        <g id="map-world">
          
          <!-- Tokyo Bay & Sumida River Water Bodies -->
          <path d="M 880,900 L 900,720 L 940,620 L 1030,570 L 1200,560 L 1200,900 Z" fill="#cbe3f7" />
          <path d="M 945,0 Q 930,220 915,380 Q 900,520 885,680 L 915,690 Q 930,520 945,380 Q 960,220 975,0 Z" fill="#cbe3f7" />
          <text x="1030" y="740" fill="#5b8db8" font-size="18" font-weight="800" letter-spacing="3">TOKYO BAY (도쿄만)</text>
          <text x="932" y="250" fill="#5b8db8" font-size="11" font-weight="700" transform="rotate(84 932,250)">스미다강 (隅田川)</text>

          <!-- Ward Zone Polygons (Stylized Accurate Geography of Central Tokyo) -->
          <!-- Shinjuku-ku -->
          <path d="M 180,220 L 420,210 L 460,340 L 410,440 L 210,450 L 160,330 Z" fill="#fef3c7" fill-opacity="0.45" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="240" y="285" fill="#b45309" font-size="16" font-weight="800" opacity="0.55">신주쿠구 (新宿区)</text>

          <!-- Bunkyo-ku -->
          <path d="M 420,90 L 660,90 L 680,240 L 460,250 Z" fill="#f1f5f9" fill-opacity="0.7" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
          <text x="530" y="145" fill="#475569" font-size="14" font-weight="800" opacity="0.55">분쿄구 (文京区)</text>

          <!-- Chiyoda-ku -->
          <path d="M 460,250 L 720,240 L 735,455 L 520,475 L 440,390 Z" fill="#dbeafe" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="545" y="305" fill="#1d4ed8" font-size="16" font-weight="800" opacity="0.55">치요다구 (千代田区)</text>

          <!-- Chuo-ku -->
          <path d="M 720,270 L 905,270 L 885,550 L 735,530 L 735,455 Z" fill="#d1fae5" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="795" y="425" fill="#047857" font-size="16" font-weight="800" opacity="0.55">추오구 (中央区)</text>

          <!-- Shibuya-ku -->
          <path d="M 150,450 L 410,440 L 430,630 L 210,670 L 140,560 Z" fill="#ffe4e6" fill-opacity="0.45" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="220" y="520" fill="#be123c" font-size="15" font-weight="800" opacity="0.55">시부야구 (渋谷区)</text>

          <!-- Minato-ku -->
          <path d="M 410,455 L 735,475 L 755,750 L 470,760 L 430,630 Z" fill="#ffe4e6" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="560" y="615" fill="#be123c" font-size="16" font-weight="800" opacity="0.55">미나토구 (港区)</text>

          <!-- Meguro & Shinagawa -->
          <path d="M 160,670 L 470,660 L 520,870 L 180,870 Z" fill="#f8fafc" fill-opacity="0.6" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
          <text x="250" y="795" fill="#475569" font-size="14" font-weight="800" opacity="0.55">메구로구 · 시나가와구</text>

          <!-- Imperial Palace (皇居) Landmark -->
          <path d="M 555,345 Q 610,330 645,365 Q 655,415 610,435 Q 555,430 545,385 Z" fill="#bbf7d0" stroke="#4ade80" stroke-width="2"/>
          <text x="598" y="392" text-anchor="middle" fill="#15803d" font-size="12" font-weight="800">황거 (皇居)</text>

          <!-- Shinjuku Gyoen Park -->
          <rect x="315" y="385" width="55" height="36" rx="10" fill="#bbf7d0" stroke="#4ade80" stroke-width="1.5"/>
          <text x="342" y="407" text-anchor="middle" fill="#15803d" font-size="9.5" font-weight="700">신주쿠교엔</text>

          <!-- ========================================================== -->
          <!-- LAYER: MAJOR RESIDENTIAL BEDTOWN COMMUTER CORRIDORS (5대 축) -->
          <!-- ========================================================== -->
          <g id="corridors-layer" class="corridor-zone">
            <!-- ① Jonan / Tokyu Line Corridor (South-West) -->
            <path d="M 30,780 L 240,610 L 360,740 L 180,890 Z" fill="#f43f5e" fill-opacity="0.13" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,3"/>
            <g transform="translate(45, 745)">
              <rect width="235" height="52" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#soft-shadow)"/>
              <text x="10" y="18" fill="#be123c" font-size="11" font-weight="800">① 조난·도큐선 대형 거주축</text>
              <text x="10" y="33" fill="#881337" font-size="9.5" font-weight="600">세타가야구 · 메구로구 · 요코하마 · 무사시코스기</text>
              <text x="10" y="45" fill="#9f1239" font-size="9">▶ 도요코선·덴엔토시선·메구로선 직결</text>
            </g>

            <!-- ② Josai / Chuo-Keio-Odakyu Corridor (West) -->
            <path d="M 10,270 L 260,340 L 250,460 L 10,500 Z" fill="#f59e0b" fill-opacity="0.14" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>
            <g transform="translate(20, 345)">
              <rect width="225" height="52" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#soft-shadow)"/>
              <text x="10" y="18" fill="#b45309" font-size="11" font-weight="800">② 조사이·주오·게이오 거주축</text>
              <text x="10" y="33" fill="#78350f" font-size="9.5" font-weight="600">스기나미구 · 나카노구 · 기치조지 · 조후 방면</text>
              <text x="10" y="45" fill="#92400e" font-size="9">▶ JR 주오선·마루노우치선·신주쿠선 직결</text>
            </g>

            <!-- ③ Johoku / Saikyo-Mita-Tobu Corridor (North) -->
            <path d="M 270,15 L 650,15 L 580,140 L 310,155 Z" fill="#3b82f6" fill-opacity="0.13" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
            <g transform="translate(330, 22)">
              <rect width="245" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#soft-shadow)"/>
              <text x="10" y="18" fill="#1d4ed8" font-size="11" font-weight="800">③ 조호쿠·사이쿄·미타선 거주축</text>
              <text x="10" y="33" fill="#1e3a8a" font-size="9.5" font-weight="600">도시마구(이케부쿠로) · 이타바시 · 사이타마(오미야)</text>
              <text x="10" y="45" fill="#1e40af" font-size="9">▶ 사이쿄선·쇼난신주쿠선·미타선·난보쿠선</text>
            </g>

            <!-- ④ Joto / Sobu-Tozai-Shinjuku Corridor (East) -->
            <path d="M 920,170 L 1185,170 L 1185,430 L 910,410 Z" fill="#10b981" fill-opacity="0.14" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
            <g transform="translate(935, 225)">
              <rect width="245" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#soft-shadow)"/>
              <text x="10" y="18" fill="#047857" font-size="11" font-weight="800">④ 조토·소부·도자이선 거주축</text>
              <text x="10" y="33" fill="#064e3b" font-size="9.5" font-weight="600">이치카와 · 후나바시 · 우라야스 · 지바 방면</text>
              <text x="10" y="45" fill="#065f46" font-size="9">▶ JR 소부선 쾌속·도자이선·도에이신주쿠선</text>
            </g>

            <!-- ⑤ Wangan / Yurakucho-Oedo Bay Corridor (South-East) -->
            <path d="M 850,510 L 1170,470 L 1170,630 L 840,650 Z" fill="#6366f1" fill-opacity="0.14" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6,3"/>
            <g transform="translate(865, 515)">
              <rect width="245" height="52" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#soft-shadow)"/>
              <text x="10" y="18" fill="#4338ca" font-size="11" font-weight="800">⑤ 완간(베이)·타워맨션 거주축</text>
              <text x="10" y="33" fill="#312e81" font-size="9.5" font-weight="600">도요스 · 가치도키 · 쓰키시마 · 몬젠나카초</text>
              <text x="10" y="45" fill="#3730a3" font-size="9">▶ 유라쿠초선·오에도선·히비야선 직결</text>
            </g>
          </g>

          <!-- ========================================================== -->
          <!-- RAILWAY NETWORK LINES                                      -->
          <!-- ========================================================== -->
          <g opacity="0.8">
            <!-- JR Yamanote Line Loop -->
            <path d="M 270,340 L 260,540 L 370,710 L 580,760 L 680,550 L 720,390 L 735,230 L 550,150 L 320,170 Z" class="rail-line" stroke="#84cc16" stroke-width="4.5" />
            <!-- JR Chuo / Sobu Line -->
            <path d="M 20,310 L 270,340 L 450,310 L 620,250 L 735,250 L 960,245 L 1180,235" class="rail-line" stroke="#f97316" stroke-width="3.5" />
            <!-- Metro Marunouchi Line -->

    // Pan & Zoom Logic for SVG
    function setupMapInteractions() {
      svgEl.addEventListener('mousedown', (e) => {
        if (e.target.closest('.pin-group')) return;
        isDragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = svgEl.getBoundingClientRect();
        const scaleX = viewBox.w / rect.width;
        const scaleY = viewBox.h / rect.height;
        const dx = (e.clientX - dragStart.x) * scaleX;
        const dy = (e.clientY - dragStart.y) * scaleY;
        viewBox.x = Math.max(-200, Math.min(400, viewBox.x - dx));
        viewBox.y = Math.max(-150, Math.min(300, viewBox.y - dy));
        dragStart = { x: e.clientX, y: e.clientY };
        updateViewBox();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      svgEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.15 : 0.87;
        zoomMap(factor);
      }, { passive: false });
    }

    function updateViewBox() {
      svgEl.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
    }

    function zoomMap(factor) {
      const newW = Math.max(320, Math.min(1300, viewBox.w * factor));
      const newH = Math.max(240, Math.min(975, viewBox.h * factor));
      viewBox.x += (viewBox.w - newW) / 2;
      viewBox.y += (viewBox.h - newH) / 2;
      viewBox.w = newW;
      viewBox.h = newH;
      updateViewBox();
    }

    function focusOnCoord(x, y) {
      viewBox.w = 560;
      viewBox.h = 420;
      viewBox.x = Math.max(-100, Math.min(750, x - viewBox.w / 2));
      viewBox.y = Math.max(-100, Math.min(550, y - viewBox.h / 2));
      updateViewBox();
    }

    function resetMapView() {
      viewBox = { x: 0, y: 0, w: 1200, h: 900 };
      updateViewBox();
    }

        if (sortVal === 'rent-asc') return a.rent - b.rent;
        if (sortVal === 'pyung-price-asc') return a.pyungPrice - b.pyungPrice;
        if (sortVal === 'area-desc') return b.areaPyung - a.areaPyung;
        if (sortVal === 'walk-asc') return a.walkMin - b.walkMin;
        if (sortVal === 'deposit-zero') {
          const aZero = a.deposit === '0개월' ? 0 : 1;
          const bZero = b.deposit === '0개월' ? 0 : 1;
          return aZero - bZero || a.rent - b.rent;
        }
        return a.id - b.id;
      });

      document.getElementById('result-badge').textContent = `${filtered.length}건`;
      renderPropertyCards(filtered);
      renderMapPins(filtered);
    }

    // Render Sidebar List Cards
    function renderPropertyCards(list) {
      const container = document.getElementById('property-list');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">조건에 일치하는 오피스 물건이 없습니다.</div>`;
        return;
      }

      list.forEach(p => {
        const isSelected = p.id === selectedId;
        const card = document.createElement('div');
        card.id = `card-${p.id}`;
        card.onclick = () => selectProperty(p.id, true);
        card.className = `p-3.5 rounded-2xl border transition-all cursor-pointer ${
          isSelected
            ? 'bg-white border-blue-600 ring-2 ring-blue-500/20 shadow-md'
            : 'bg-white border-slate-200/90 hover:border-slate-300 hover:shadow-xs'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-6 h-6 rounded-full text-white font-extrabold text-[11px] flex items-center justify-center shrink-0 shadow-xs" style="background-color:${p.color}">
                ${p.id}
              </span>
              <div class="min-w-0">
                <h3 class="font-bold text-slate-900 text-xs sm:text-sm truncate">${p.name}</h3>
                <p class="text-[11px] text-slate-500 truncate">${p.ward} · ${p.address}</p>
              </div>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ${
              p.deposit === '0개월' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600'
            }">
              보증금 ${p.deposit}
            </span>
          </div>

          <!-- 4 Key Metrics Grid -->
          <div class="mt-2.5 grid grid-cols-3 gap-1.5 bg-slate-50 rounded-xl p-2 border border-slate-100 text-center">
            <div>
              <span class="block text-[10px] text-slate-400">월 임대료</span>
              <span class="font-extrabold text-slate-900 text-xs">${p.rent.toLocaleString()}엔</span>
            </div>
            <div class="border-x border-slate-200/70">
              <span class="block text-[10px] text-slate-400">면적 / 평당가</span>
              <span class="font-bold text-blue-600 text-xs">${p.areaPyung}평 <span class="text-[10px] text-slate-500">(${(p.pyungPrice/10000).toFixed(1)}만)</span></span>
            </div>
            <div>
              <span class="block text-[10px] text-slate-400">최기역 도보</span>
              <span class="font-bold text-slate-800 text-xs">도보 ${p.walkMin}분</span>
            </div>
          </div>

          <div class="mt-2 flex items-center gap-1.5 text-[11px] text-slate-700 font-medium">
            <i class="ph-bold ph-train text-blue-600 shrink-0"></i>
            <span class="truncate">${p.station}</span>
          </div>

          <!-- Residential Bedtown Commute Highlight -->
          <div class="mt-2 bg-indigo-50/70 border border-indigo-100 rounded-xl p-2.5 text-[11px] space-y-1">
            <div class="font-bold text-indigo-900 flex items-center gap-1">
              <i class="ph-fill ph-house-line text-indigo-600"></i> 주요 대형 거주구역 통근 평가
            </div>
            <p class="text-slate-700 leading-relaxed">${p.commuteEval}</p>
            <div class="pt-1 border-t border-indigo-100/80 text-slate-600">
              <span class="font-semibold text-slate-800">주변환경:</span> ${p.envEval}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Render Pins on SVG Map
    function renderMapPins(filteredList) {
      pinsLayer.innerHTML = '';
      const filteredIds = new Set(filteredList.map(p => p.id));

      // Draw unselected pins first, selected pin last so it's always on top
      const sortedForDraw = [...properties].sort((a, b) => (a.id === selectedId ? 1 : b.id === selectedId ? -1 : 0));

      sortedForDraw.forEach(p => {
        const isVisible = filteredIds.has(p.id);
        const isSelected = p.id === selectedId;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'pin-group');
        g.setAttribute('transform', `translate(${p.x}, ${p.y})`);
        g.style.opacity = isVisible ? '1' : '0.2';

        g.onclick = (e) => {
          e.stopPropagation();
          selectProperty(p.id, false);
        };

        // Pulse ring for active pin
        if (isSelected) {
          const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          pulse.setAttribute('r', '20');
          pulse.setAttribute('fill', p.color);
          pulse.setAttribute('fill-opacity', '0.25');
          g.appendChild(pulse);
        }

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'pin-circle');
        circle.setAttribute('r', isSelected ? '14' : '11');
        circle.setAttribute('fill', p.color);
        circle.setAttribute('stroke', '#ffffff');
        circle.setAttribute('stroke-width', isSelected ? '3' : '2');
        g.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dy', '3.8');
        text.setAttribute('fill', '#ffffff');
        text.setAttribute('font-size', isSelected ? '11' : '9.5');
        text.setAttribute('font-weight', '800');
        text.textContent = p.id;
        g.appendChild(text);

        // Label badge when selected
        if (isSelected) {
          const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          labelGroup.setAttribute('transform', 'translate(0, -24)');
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          const labelText = `${p.id}. ${p.name}`;
          const width = Math.max(110, labelText.length * 7.5);
          rect.setAttribute('x', -width / 2);
          rect.setAttribute('y', -14);
          rect.setAttribute('width', width);
          rect.setAttribute('height', 20);
          rect.setAttribute('rx', '6');
          rect.setAttribute('fill', '#0f172a');
          labelGroup.appendChild(rect);

          const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          lbl.setAttribute('text-anchor', 'middle');
          lbl.setAttribute('y', -1);
          lbl.setAttribute('fill', '#ffffff');
          lbl.setAttribute('font-size', '10');
          lbl.setAttribute('font-weight', '700');
          lbl.textContent = labelText;
          labelGroup.appendChild(lbl);
          g.appendChild(labelGroup);
        }

        pinsLayer.appendChild(g);
      });
    }

    // Select Property & Open Floating Inspector Card
    function selectProperty(id, panMap = true) {
      selectedId = id;
      const p = properties.find(item => item.id === id);
      if (!p) return;

      applyFilters();

      const cardEl = document.getElementById(`card-${id}`);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      if (panMap) {
        focusOnCoord(p.x, p.y);
      }

      // Render Floating Map Detail Inspector
      const detailBox = document.getElementById('map-detail-card');
      detailBox.classList.remove('hidden');
      detailBox.innerHTML = `
        <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full text-white font-extrabold text-xs flex items-center justify-center shrink-0" style="background-color:${p.color}">
              ${p.id}
            </span>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${p.groupName}</span>
                <span class="text-[10px] font-semibold text-slate-400">${p.built}</span>
              </div>
              <h4 class="font-extrabold text-slate-900 text-sm mt-0.5">${p.name}</h4>
            </div>
          </div>
          <button onclick="document.getElementById('map-detail-card').classList.add('hidden')" class="text-slate-400 hover:text-slate-700 p-1">
            <i class="ph-bold ph-x text-base"></i>
          </button>
        </div>

        <div class="mt-2.5 grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200/60 text-xs">
          <div>
            <span class="text-[10px] text-slate-400 block">비용 (월 임대료)</span>
            <span class="font-extrabold text-slate-900">${p.rent.toLocaleString()}엔</span>
            <span class="block text-[10px] text-emerald-700 font-bold">보증금 ${p.deposit}</span>
          </div>
          <div>
            <span class="text-[10px] text-slate-400 block">면적 및 평당단가</span>
            <span class="font-extrabold text-blue-600">${p.areaPyung}평</span>
            <span class="block text-[10px] text-slate-500">평당 ${p.pyungPrice.toLocaleString()}엔</span>
          </div>
          <div>
            <span class="text-[10px] text-slate-400 block">인원 및 역거리</span>
            <span class="font-bold text-slate-800">${p.seats}</span>
            <span class="block text-[10px] text-blue-700 font-semibold">최기역 도보 ${p.walkMin}분</span>
          </div>
        </div>

        <div class="mt-2.5 space-y-2 text-[11px]">
          <div class="text-slate-700 flex items-center gap-1.5 font-semibold">
            <i class="ph-bold ph-train text-blue-600"></i>
            <span>${p.station}</span>
          </div>

          <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-2.5">
            <div class="font-extrabold text-blue-900 mb-0.5 flex items-center gap-1">
              <i class="ph-fill ph-users-three text-blue-600"></i> 대형 거주구역(베드타운) 출퇴근 평가
            </div>
            <p class="text-slate-700 leading-relaxed">${p.commuteEval}</p>
          </div>

          <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-2.5">
            <div class="font-extrabold text-slate-800 mb-0.5 flex items-center gap-1">
              <i class="ph-fill ph-buildings text-slate-600"></i> 주변환경 & 상권 평가
            </div>
            <p class="text-slate-600 leading-relaxed">${p.envEval}</p>
          </div>
        </div>
      `;
    }

    window.onload = init;
  </script>
</body>
</html>
